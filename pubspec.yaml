name: aptitude_pro_app
description: "Aplicación móvil de orientación vocacional AptitudePro"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  pretty_dio_logger: ^1.3.1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI Components
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1

  # Forms & Validation
  reactive_forms: ^17.0.1

  # Navigation
  go_router: ^14.2.0

  # Utilities
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  intl: ^0.19.0
  equatable: ^2.0.5

  # Charts & Analytics
  fl_chart: ^0.68.0

  # Date & Time
  flutter_datetime_picker_plus: ^2.2.0

  # Permissions
  permission_handler: ^11.3.1

  # Images
  image_picker: ^1.1.2
  share_plus: ^11.0.0
  table_calendar: ^3.1.3
  url_launcher: ^6.3.1
  
  # Bloc
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  # To add assets
  assets:
    - assets/